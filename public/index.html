<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Asistente de Voz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #ff0000;
    --accent-live: #ff5c5c;
    --text: #e8e9ed;
    --muted: #8b8f9a;
    --error: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 100px;
  }
  h1 { font-size: 18px; margin: 4px 0 16px; color: var(--muted); font-weight: 600; }
  #status {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    min-height: 18px;
  }
  .mic-wrap {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }
  #micBtn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #micBtn.listening {
    background: var(--accent-live);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,92,92,0.5); }
    70% { box-shadow: 0 0 0 18px rgba(255,92,92,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,92,92,0); }
  }
  .manual {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #manualInput {
    flex: 1;
    background: var(--card);
    border: 1px solid #2a2e38;
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
    font-size: 14px;
  }
  #manualBtn {
    background: var(--card);
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
  }
  .lang-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .lang-row button {
    flex: 1;
    background: var(--card);
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 10px 0;
    font-size: 14px;
    transition: opacity 0.15s ease;
  }
  .entry {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid #23262f;
  }
  .entry .q { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .entry .a { font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .entry .a.loading { color: var(--muted); }
  .entry .a.error { color: var(--error); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #liveTranscript {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 14px;
    font-style: italic;
  }
  details {
    margin-bottom: 16px;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 14px;
  }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  textarea {
    width: 100%;
    margin-top: 10px;
    background: #0f1115;
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    min-height: 160px;
  }
  #savePromptBtn {
    margin-top: 8px;
    background: var(--bg);
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>Asistente de Voz</h1>

  <details open>
    <summary>Prompt (tu CV) — tocar para editar</summary>
    <textarea id="promptArea" placeholder="Pegá acá tu curriculum vitae completo: experiencia, cargos, tecnologías, herramientas, logros, idiomas, formación, etc."></textarea>
    <button id="savePromptBtn">Guardar prompt</button>
  </details>

  <div class="lang-row">
    <button id="langEsBtn">🎙️ Español</button>
    <button id="langEnBtn">🎙️ English</button>
  </div>

  <div id="status">Toca el microfono para empezar</div>
  <div id="liveTranscript"></div>
  <div id="log"></div>

  <div class="manual">
    <input id="manualInput" type="text" placeholder="O escribe la pregunta acá / Or type here..." />
    <button id="manualBtn">Preguntar</button>
  </div>

  <div class="mic-wrap">
    <button id="micBtn">🎙️</button>
  </div>

<script>
const statusEl = document.getElementById('status');
const liveEl = document.getElementById('liveTranscript');
const logEl = document.getElementById('log');
const micBtn = document.getElementById('micBtn');
const manualInput = document.getElementById('manualInput');
const manualBtn = document.getElementById('manualBtn');
const promptArea = document.getElementById('promptArea');
const savePromptBtn = document.getElementById('savePromptBtn');
const langEsBtn = document.getElementById('langEsBtn');
const langEnBtn = document.getElementById('langEnBtn');

// El prompt (tu CV) se guarda solo en este dispositivo (localStorage del
// navegador), no en un servidor. Pegalo una vez y queda listo para la próxima.
promptArea.value = localStorage.getItem('userPrompt') || '';
savePromptBtn.onclick = () => {
  localStorage.setItem('userPrompt', promptArea.value);
  statusEl.textContent = 'Prompt guardado ✔ (' + promptArea.value.length + ' caracteres)';
};

// Idioma del reconocimiento de voz. El Web Speech API no detecta el idioma
// automáticamente en vivo, así que el usuario elige antes de hablar.
// La respuesta del modelo, en cambio, sí detecta el idioma de la pregunta
// y responde en ese idioma sin importar cuál esté seleccionado acá.
let recogLang = localStorage.getItem('recogLang') || 'en-US';

function updateLangButtons() {
  langEsBtn.style.opacity = recogLang === 'es-419' ? '1' : '0.5';
  langEnBtn.style.opacity = recogLang === 'en-US' ? '1' : '0.5';
}
updateLangButtons();

langEsBtn.onclick = () => {
  recogLang = 'es-419';
  localStorage.setItem('recogLang', recogLang);
  updateLangButtons();
  if (listening) restartRecognition();
};
langEnBtn.onclick = () => {
  recogLang = 'en-US';
  localStorage.setItem('recogLang', recogLang);
  updateLangButtons();
  if (listening) restartRecognition();
};

function restartRecognition() {
  if (recognition) { try { recognition.stop(); } catch (e) {} }
  recognition = setupRecognition();
  if (recognition) recognition.start();
}

let listening = false;
let recognition = null;
let silenceTimer = null;
let lastAskedText = ''; // evita repetir la misma pregunta en loop si el reconocimiento la vuelve a emitir

// Palabras clave en español e inglés: así detecta preguntas sin importar
// qué idioma tenga puesto el reconocimiento de voz en ese momento.
const QUESTION_HINTS = [
  '¿', 'qué', 'que', 'cómo', 'como', 'cuál', 'cual', 'dónde', 'donde',
  'por qué', 'porque', 'cuándo', 'cuando', 'para qué',
  'what', 'how', 'which', 'where', 'why', 'when', 'who',
  'can you', 'could you', 'tell me', 'walk me through', 'explain'
];

function looksLikeQuestion(text) {
  const t = text.toLowerCase();
  return QUESTION_HINTS.some((h) => t.includes(h));
}

function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusEl.textContent = 'Este navegador no soporta reconocimiento de voz. Usá Chrome en Android.';
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = recogLang;
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event) => {
    let interim = '';
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const chunk = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += chunk + ' ';
      else interim += chunk;
    }
    liveEl.textContent = final + interim;

    if (final.trim()) {
      clearTimeout(silenceTimer);
      const finalText = final.trim();
      // Espera breve por si sigue hablando; si la frase parece pregunta, dispara solo.
      silenceTimer = setTimeout(() => {
        if (looksLikeQuestion(finalText) && finalText !== lastAskedText) {
          lastAskedText = finalText;
          askClaude(finalText);
          liveEl.textContent = '';
        }
      }, 700);
    }
  };

  rec.onerror = (e) => {
    statusEl.textContent = 'Error de reconocimiento: ' + e.error;
  };

  rec.onend = () => {
    // Android/Chrome corta el reconocimiento solo cada ~60s; si seguimos "escuchando", reiniciar.
    if (listening) {
      try { rec.start(); } catch (e) {}
    }
  };

  return rec;
}

micBtn.onclick = () => {
  if (!listening) {
    recognition = setupRecognition();
    if (!recognition) return;
    recognition.start();
    listening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = 'Escuchando (' + recogLang + ')... acercá el celular al parlante';
  } else {
    listening = false;
    if (recognition) recognition.stop();
    micBtn.classList.remove('listening');
    statusEl.textContent = 'Pausado';
    liveEl.textContent = '';
  }
};

manualBtn.onclick = () => {
  const text = manualInput.value.trim();
  if (text) {
    askClaude(text);
    manualInput.value = '';
  }
};

async function askClaude(question) {
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<div class="q">${escapeHtml(question)}</div><div class="a loading">Pensando...</div>`;
  logEl.prepend(entry);
  const answerEl = entry.querySelector('.a');

  try {
    const res = await fetch('/api/ask-gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transcript: question,
        prompt: localStorage.getItem('userPrompt') || '',
      }),
    });

    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      answerEl.textContent = 'Respuesta no-JSON del servidor (status ' + res.status + ')';
      answerEl.classList.remove('loading');
      answerEl.classList.add('error');
      return;
    }

    if (!res.ok) {
      // Se muestra el detalle real (data.detail) que devuelve la API de Gemini.
      answerEl.textContent = 'Error (' + res.status + '): ' + (data.error || 'desconocido') +
        (data.detail ? '\n\n' + data.detail : '');
      answerEl.classList.remove('loading');
      answerEl.classList.add('error');
      return;
    }

    if (!data.answer || data.answer.trim() === 'SIN_PREGUNTA') {
      entry.remove(); // no era una pregunta real, no ensuciamos el log
      return;
    }

    answerEl.textContent = data.answer;
    answerEl.classList.remove('loading');

    if (data.finishReason === 'MAX_TOKENS') {
      answerEl.textContent += '\n\n⚠️ Respuesta posiblemente cortada (límite de tokens).';
    }
  } catch (err) {
    answerEl.textContent = 'Fallo de red: ' + err.message;
    answerEl.classList.remove('loading');
    answerEl.classList.add('error');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
