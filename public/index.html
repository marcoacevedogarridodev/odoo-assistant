<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Asistente de Voz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #ff0000;
    --accent-live: #ff5c5c;
    --text: #e8e9ed;
    --muted: #8b8f9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 100px;
  }
  h1 { font-size: 18px; margin: 4px 0 16px; color: var(--muted); font-weight: 600; }
  #status {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    min-height: 18px;
  }
  .mic-wrap {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }
  #micBtn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #micBtn.listening {
    background: var(--accent-live);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,92,92,0.5); }
    70% { box-shadow: 0 0 0 18px rgba(255,92,92,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,92,92,0); }
  }
  .manual {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #manualInput {
    flex: 1;
    background: var(--card);
    border: 1px solid #2a2e38;
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
    font-size: 14px;
  }
  #manualBtn {
    background: var(--card);
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
  }
  .entry {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid #23262f;
  }
  .entry .q { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .entry .a { font-size: 20px; line-height: 1.4; white-space: pre-wrap; }
  .entry .a.loading { color: var(--muted); }
  #liveTranscript {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 14px;
    font-style: italic;
  }
  details {
    margin-bottom: 16px;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 14px;
  }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  textarea {
    width: 100%;
    margin-top: 10px;
    background: #0f1115;
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    min-height: 120px;
  }
  #saveContextBtn {
    margin-top: 8px;
    background: var(--bg);
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>Asistente de Voz</h1>

  <details>
    <summary>Contexto — tocar para editar</summary>
    <textarea id="contextArea" placeholder="Pega aca el contenido PDF..."></textarea>
    <button id="saveContextBtn">Guardar contexto</button>
  </details>

  <div id="status">Toca el microfono para empezar</div>
  <div id="liveTranscript"></div>
  <div id="log"></div>

  <div class="manual">
    <input id="manualInput" type="text" placeholder="O escribe la pregunta acá..." />
    <button id="manualBtn">Preguntar</button>
  </div>

  <div class="mic-wrap">
    <button id="micBtn">🎤</button>
  </div>

<script>
const statusEl = document.getElementById('status');
const liveEl = document.getElementById('liveTranscript');
const logEl = document.getElementById('log');
const micBtn = document.getElementById('micBtn');
const manualInput = document.getElementById('manualInput');
const manualBtn = document.getElementById('manualBtn');
const contextArea = document.getElementById('contextArea');
const saveContextBtn = document.getElementById('saveContextBtn');

// El contexto se guarda solo en este dispositivo (localStorage del navegador Android),
// no en un servidor. Pegalo una vez y queda listo para la próxima.
contextArea.value = localStorage.getItem('odooContext') || '';
saveContextBtn.onclick = () => {
  localStorage.setItem('odooContext', contextArea.value);
  statusEl.textContent = 'Contexto guardado ✔';
};

let listening = false;
let recognition = null;
let silenceTimer = null;
const QUESTION_HINTS = ['¿', 'qué', 'que', 'cómo', 'como', 'cuál', 'cual', 'dónde', 'donde', 'por qué', 'porque', 'cuándo', 'cuando', 'para qué'];

function looksLikeQuestion(text) {
  const t = text.toLowerCase();
  return QUESTION_HINTS.some((h) => t.includes(h));
}

function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusEl.textContent = 'Este navegador no soporta reconocimiento de voz. Usá Chrome en Android.';
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = 'es-419';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event) => {
    let interim = '';
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const chunk = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += chunk + ' ';
      else interim += chunk;
    }
    liveEl.textContent = final + interim;

    if (final.trim()) {
      clearTimeout(silenceTimer);
      const finalText = final.trim();
      // Espera breve por si sigue hablando; si la frase parece pregunta, dispara solo.
      silenceTimer = setTimeout(() => {
        if (looksLikeQuestion(finalText)) {
          askClaude(finalText);
          liveEl.textContent = '';
        }
      }, 700);
    }
  };

  rec.onerror = (e) => {
    statusEl.textContent = 'Error de reconocimiento: ' + e.error;
  };

  rec.onend = () => {
    // Android/Chrome corta el reconocimiento solo cada ~60s; si seguimos "escuchando", reiniciar.
    if (listening) {
      try { rec.start(); } catch (e) {}
    }
  };

  return rec;
}

micBtn.onclick = () => {
  if (!listening) {
    recognition = setupRecognition();
    if (!recognition) return;
    recognition.start();
    listening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = 'Escuchando... acercá el celular al parlante';
  } else {
    listening = false;
    if (recognition) recognition.stop();
    micBtn.classList.remove('listening');
    statusEl.textContent = 'Pausado';
    liveEl.textContent = '';
  }
};

manualBtn.onclick = () => {
  const text = manualInput.value.trim();
  if (text) {
    askClaude(text);
    manualInput.value = '';
  }
};

async function askClaude(question) {
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<div class="q">${escapeHtml(question)}</div><div class="a loading">Pensando...</div>`;
  logEl.prepend(entry);
  const answerEl = entry.querySelector('.a');

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transcript: question,
        odooContext: localStorage.getItem('odooContext') || '',
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      answerEl.textContent = 'Error: ' + (data.error || 'desconocido');
      answerEl.classList.remove('loading');
      return;
    }

    if (!data.answer || data.answer.trim() === 'SIN_PREGUNTA') {
      entry.remove(); // no era una pregunta real, no ensuciamos el log
      return;
    }

    answerEl.textContent = data.answer;
    answerEl.classList.remove('loading');
  } catch (err) {
    answerEl.textContent = 'Fallo de red: ' + err.message;
    answerEl.classList.remove('loading');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
